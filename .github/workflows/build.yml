name: OneClient Installer Build

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # 1. Обязательный шаг: скачиваем файлы репозитория (включая ваш zip) на раннер
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Теперь скрипт найдет zip-архив
      - name: Unpack source archive
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path ${{ github.workspace }} -Filter *.zip | Select-Object -First 1
          if (-not $zip) { Write-Error "Zip-архив не найден: положите OneLauncher-elyby-offline.zip в корень репозитория"; exit 1 }
          Expand-Archive -Path $zip.FullName -DestinationPath source
          if (-not (Test-Path source/OneLauncher-main/Cargo.toml)) { Write-Error "В zip нет папки OneLauncher-main"; exit 1 }
          Write-Host "Источник: $($zip.Name)"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install cargo-packager 0.11.8
        shell: bash
        run: |
          cargo binstall --no-confirm --force cargo-packager@0.11.8 \
            || cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Build launcher (release)
        shell: bash
        working-directory: source/OneLauncher-main
        run: cargo build --release --bin oneclient_app

      - name: Stage app-local VC++ runtime
        shell: bash
        working-directory: source/OneLauncher-main
        run: python distribution/windows/bundle-crt.py # На Windows-раннере команда python3 может не сработать, лучше использовать python

      - name: Package NSIS installer
        shell: bash
        working-directory: source/OneLauncher-main
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Upload ready installer
        uses: actions/upload-artifact@v4
        with:
          name: OneClient-windows-setup
          path: source/OneLauncher-main/target/release/*-setup.exe
          if-no-files-found: error
