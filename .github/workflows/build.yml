name: OneClient Installer Build

# Собирает Windows-инсталлер (oneclient_app_2.10.2_x64-setup.exe) с ВАШИМИ
# изменениями (Ely.by + оффлайн-аккаунты) внутри. Rust/Cargo локально НЕ нужны:
# всё собирает сервер GitHub. Готовый файл появится в разделе "Artifacts"
# на странице запуска (внизу, после зелёной галочки).

on:
  push:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # 1. ОБЯЗАТЕЛЬНО: Скачиваем файлы репозитория (включая ваш zip-архив) на сервер
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Распаковка архива через 7-Zip (обходим ошибку "Central Directory corrupt")
      - name: Unpack source archive
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path ${{ github.workspace }} -Filter *.zip | Select-Object -First 1
          if (-not $zip) { 
              Write-Error "Zip-архив не найден: положите OneLauncher-elyby-offline.zip в корень репозитория"
              exit 1 
          }
          
          # 7-Zip обычно уже предустановлен на windows-latest, но на всякий случай проверяем путь
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { 
              $7z = "7z" # Если лежит в PATH
          }
          
          Write-Host "Распаковка архива: $($zip.Name)"
          # x - извлечь, -o - папка назначения, -y - подтвердить всё
          & $7z x $zip.FullName -o"source" -y
          
          if (-not (Test-Path source/OneLauncher-main/Cargo.toml)) { 
              Write-Error "В zip нет папки OneLauncher-main"
              exit 1 
          }
          Write-Host "Успешно распакован источник: $($zip.Name)"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1

      - name: Install cargo-packager 0.11.8
        shell: bash
        run: |
          cargo binstall --no-confirm --force cargo-packager@0.11.8 \
            || cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Build launcher (release)
        shell: bash
        working-directory: source/OneLauncher-main
        run: cargo build --release --bin oneclient_app

      - name: Stage app-local VC++ runtime
        shell: bash
        working-directory: source/OneLauncher-main
        # Используем python вместо python3
        run: python distribution/windows/bundle-crt.py 

      - name: Package NSIS installer
        shell: bash
        working-directory: source/OneLauncher-main
        env:
          CI: 'true'
        run: cargo packager --release --formats nsis --verbose

      - name: Upload ready installer
        uses: actions/upload-artifact@v4
        with:
          name: OneClient-windows-setup
          path: source/OneLauncher-main/target/release/*-setup.exe
          if-no-files-found: error
